apiVersion: v1
kind: ConfigMap
metadata:
  name: pgrestoredrill-drill
data:
  drill.yaml: |
    name: sample
    source_kind: s3
    source_uri: backups/
    bucket: pgrestoredrill
    endpoint_url: http://silo:9000
    region: us-east-1
    rpo_minutes: 1440
    assertions_file: assertions.yaml
    enabled: true
    restore_timeout_seconds: 120
    statement_timeout_ms: 5000
